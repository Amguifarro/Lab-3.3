<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  


</head>

<body class="m-0 bg-[#D5E1EF] min-h-screen flex flex-col justify-center items-center text-[15px]">

  <main>

    <div class="w-[352px] bg-white p-4 rounded-2xl flex flex-col items-center">

      <img
        src="images/image-qr-code.png"
        alt="Blue QR code"
        class="w-full rounded-[10px]"
      >

      <h1 class="text-[22px] font-bold text-center mt-6 mx-4 mb-4">
        Improve your front-end skills by building projects
      </h1>

      <p class="text-[15px] text-center mx-4 mb-6">
        Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
      </p>

    </div>

  </main>

  <footer class="text-[11px] text-center mt-4">
    Challenge by
    <a class="text-blue-700"
       href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.
    Coded by
    <a class="text-blue-700" href="#">
      Amara Guifarro
    </a>.
  </footer>

</body>
</html>
